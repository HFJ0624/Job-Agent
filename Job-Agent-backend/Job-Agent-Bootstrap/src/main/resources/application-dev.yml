# 配置服务端口号
server:
  port: 8500

# 配置数据库连接信息 url需要改成自己的虚拟机ip地址192.168.10.100
# 安全：口令等敏感配置改为环境变量注入，不在仓库保留明文；已泄露口令需轮换（改配置不够）。
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.10.100:3306/job_agent?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 10MB # 单个文件最大上传大小：改为10MB
      max-request-size: 10MB # 单次请求最大大小（多文件上传总大小），建议和单文件一致

    # Redis的相关配置
  data:
    redis:
      host: 192.168.10.100
      port: 6379
  #  password: ${REDIS_PASSWORD:}

  # Flyway：数据库 Schema 版本化管理（任务4）
  flyway:
    enabled: true
    # 现有库首次启动自动打基线（不执行历史脚本）；全新库从 V1__baseline.sql 重建
    baseline-on-migrate: true
    baseline-version: 1
    # 迁移脚本目录：Job-Agent-Bootstrap/src/main/resources/db/migration，命名 V{n}__desc.sql
    locations: classpath:db/migration

# 自定义配置 访问权限路由配置
job:
  minio:
    endpointUrl: http://192.168.10.100:9001
    accessKey: ${MINIO_ACCESS_KEY:}
    secreKey: ${MINIO_SECRET_KEY:}
    bucketName: job-agent-bucket

  agent:
    draft:
      # Agent 草稿过期时间，单位：分钟
      ttl-minutes: 15

  workflow:
    # 工作流调度器轮询间隔（毫秒）。原为硬编码 1 小时，现改为可配置；默认 5 秒。
    poll-interval-ms: 5000

# MyBatis-Plus配置
mybatis-plus:
  # 自定义SQL的mapper.xml文件路径（如果有）
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径
  type-aliases-package: com.job.common
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志（开发用）
  global-config:
    db-config:
      logic-delete-field: isDeleted # 逻辑删除字段使用实体属性名
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端请求头或 Cookie 中携带的 token 名称。
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true
